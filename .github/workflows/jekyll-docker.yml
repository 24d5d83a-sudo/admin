name: Jekyll Docker

on:
  push:
	branches: [ main ]
  pull_request:
	branches: [ main ]

jobs:
  build:
	runs-on: ubuntu-latest
	steps:
	  - uses: actions/checkout@v3
	  - name: Build Jekyll site
		run: |
		  docker run --rm -v "${{ github.workspace }}":/srv/jekyll jekyll/jekyll:latest jekyll build
